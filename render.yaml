# One-click deploy of the signaling server on Render (https://render.com/docs/blueprint-spec).
# After the first deploy, put the service URL into the EXPO_PUBLIC_SIGNALING_URL repository
# variable so the GitHub Pages build points at it.
services:
  - type: web
    name: collab-signaling
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '4000'
      - key: EXECUTION_BACKEND
        value: local
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_STORE_URL
        sync: false
      - key: AUTH_GIST_ID
        sync: false
      - key: AUTH_GIST_TOKEN
        sync: false
