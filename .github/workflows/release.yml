name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  EXPO_PUBLIC_SIGNALING_URL: ${{ vars.EXPO_PUBLIC_SIGNALING_URL || 'https://collab-signaling.onrender.com' }}
  EXPO_PUBLIC_EXECUTION_URL: ${{ vars.EXPO_PUBLIC_SIGNALING_URL || 'https://collab-signaling.onrender.com' }}
  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || '560742571865-eqeojukg2kqm2gmaumm79n2606e75pus.apps.googleusercontent.com' }}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: collab-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npm run export:web

      - name: Stage web build for desktop
        run: npm run desktop:web

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Package Windows installer
        working-directory: desktop
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: collab-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npm run export:web

      - name: Stage web build for desktop
        run: npm run desktop:web

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Package macOS DMG
        working-directory: desktop
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: collab-macos
          path: desktop/dist/*.dmg
          if-no-files-found: error

  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build unsigned archive
        working-directory: ios
        run: |
          SCHEME=$(basename ./*.xcworkspace .xcworkspace)
          xcodebuild archive \
            -workspace "$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/*.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/Collab-unsigned.ipa" Payload)

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: collab-ios
          path: Collab-unsigned.ipa
          if-no-files-found: error

  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npm run export:web

      - name: Stage web build for desktop
        run: npm run desktop:web

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Package Linux binaries
        working-directory: desktop
        run: npm run dist:linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: collab-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/collab-android/*.apk
            artifacts/collab-ios/*.ipa
            artifacts/collab-windows/*.exe
            artifacts/collab-macos/*.dmg
            artifacts/collab-linux/*.AppImage
            artifacts/collab-linux/*.deb
