name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

  e2e:
    name: Two-browser e2e
    # Playwright 1.56 cannot install Chromium deps on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Export the web app
        run: npm run e2e:build

      - name: Run e2e
        run: npm run e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  server-image:
    name: Server image boots and serves /ice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Render deploys this exact image. If it crashes on boot, Render silently
      # keeps the previous build, and calls lose their TURN relay (no audio).
      - name: Build image
        run: docker build -f server/Dockerfile -t collab-signaling .

      - name: Boot and probe
        run: |
          docker run -d --name signaling -p 4000:4000 collab-signaling
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/health && break
            sleep 2
          done
          curl -fsS http://localhost:4000/health
          curl -fsS http://localhost:4000/ice | tee ice.json
          node -e "const b=require('./ice.json'); if(!Array.isArray(b.iceServers)||b.iceServers.length===0) process.exit(1)"

      - name: Server logs
        if: always()
        run: docker logs signaling || true
